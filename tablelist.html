<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table align="center" border="1" cellpadding="20px" width="40%">
        <tr>
            <th colspan="5">Table</th>
        </tr>
        <tr>
            <td rowspan="2">A</td>
            <td colspan="3" align="center">B</td>
            <td>C</td>
        </tr>
        <tr>
            <td rowspan="1">D</td>
            <td rowspan="1">E</td>
            <td colspan="2" align="center">F</td>
        </tr>
        <tr>
            <td colspan="3" align="center">G</td>
            <td rowspan="2" colspan="2" align="center">H</td>
        </tr>
        <tr>
            <td colspan="2" align="center">I</td>
            <td rowspan="1">J</td>
        </tr>
        <tr>
            <td rowspan="2" colspan="2" align="center">K</td>
            <td rowspan="1">L</td>
            <td rowspan="1">M</td>
            <td rowspan="1">N</td>
        </tr>
        <tr>
            <td rowspan="1">O</td>
            <td colspan="2" align="center">P</td>
        </tr>



    </table>
</body>

</html>
